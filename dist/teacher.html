<!doctype html>
<html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寫字樂 · 班級小挑戰</title>
<style>.assessment-panel { position:fixed; inset:0; z-index:50; overflow:auto; background:#f5f6ed; color:#20392e; padding:12px 24px 104px; font-family:system-ui,sans-serif; }

.assessment-completed { position:absolute; right:10px; bottom:10px; border-radius:8px; padding:2px 10px; font-size:18px; color:#214b3b; background:#e9eddf; }
.assessment-choice-card:disabled { opacity:1; }
.assessment-controls .assessment-status:empty { display:none; }
.assessment-status { min-height:1.5em; margin:4px 0; font-size:16px; }

<body><main><h1>寫字樂 · 班級小挑戰</h1>
<section><h2>今次題目</h2><p id="assignment"></p><label for="mode">題型 </label><select id="mode"><option value="copy">看字寫</option><option value="listen" hidden>看字寫</option></select> <button id="create">建立班級</button> <button id="new-class" hidden>開新一班</button></section>

<script>

    for (const row of BishunAssessment.timeRanks(automatic.map(member => ({ alias: member.alias, elapsedMs: member.automaticElapsedMs })))) section.append(text('p', row.rank + ' · ' + row.alias + ' · ' + (row.elapsedMs / 1000).toFixed(1) + ' 秒'));
  }
  if (data.published || submitted.length) {
    section.append(text('h2', data.published ? '已公布舊版班級榜' : '舊版班級榜尚未公布'));
    let mode;
    for (const row of data.rows) {
      if (row.mode && row.mode !== mode) { section.append(text('h3', row.mode === 'copy' ? '看字寫' : '聽詞寫')); mode = row.mode; }
      section.append(text('p', row.rank + ' · ' + row.alias + ' · ' + row.score + ' 字正確'));
    }
  }
  const ready = submitted.length > 0 && submitted.every(member => Number.isInteger(member.score));
  if (submitted.length && !data.published && !ready) section.append(text('p', '請先完成已交舊版原卷的批改。'));
  $('board').replaceChildren(section); $('publish').disabled = data.published || !ready; $('publish').hidden = !data.published && !submitted.length;
}
async function refreshReviewed(room) {
  const data = await request('/' + room.code + '/reviews');
  if (draft.room?.code !== room.code) return;
  const list = document.createElement('div');
  for (const member of data.members) {
    const row = document.createElement('p');
    row.append(text('span', member.alias + ' · ' + (member.automaticRunId ? '已完成 · ' + (member.automaticElapsedMs / 1000).toFixed(1) + ' 秒' : !member.runId ? '未交卷' : member.score === null ? '待批改' : member.score + ' 字正確')));
    if (member.runId) {
      const button = text('button', '查看／批改原卷');
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const original = await request('/' + room.code + '/reviews/' + member.memberId);
          if (draft.room?.code !== room.code) return;
          stopReview?.(); $('review').hidden = false;
          stopReview = BishunAssessmentReview.mount($('review'), original, async changes => {
            const result = await request('/' + room.code + '/reviews/' + member.memberId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes) });
            if (draft.room?.code === room.code) await refreshReviewed(room);
            return result;
          });
        } catch (error) { if (draft.room?.code === room.code) $('status').textContent = error.message; }
        finally { button.disabled = false; }
      }); row.append(button);
    }
    if (member.automaticRunId) {
      const button = text('button', '查看筆順小挑戰原卷');
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const original = await request('/' + room.code + '/automatic-original/' + member.memberId);
          if (draft.room?.code !== room.code) return;
          stopReview?.(); stopReview = null; $('review').hidden = false; $('review').replaceChildren();
          $('review').append(text('h2', member.alias + ' · ' + (original.receipt.elapsedMs / 1000).toFixed(1) + ' 秒'));
          const positions = BishunAssessment.positions(original.run.assignment), answers = document.createElement('div'); answers.className = 'review-answers';
          original.run.answers.forEach((answer, index) => {
            const card = document.createElement('section'), paper = document.createElement('div'); card.className = 'review-answer'; paper.className = 'review-paper';
            card.append(text('h3', positions[index].word + ' · 第 ' + (positions[index].index + 1) + ' 字'), paper);
            BishunFreehand.render(paper, answer.strokes); answers.append(card);
          });
          $('review').append(answers);
        } catch (error) { if (draft.room?.code === room.code) $('status').textContent = error.message; }
        finally { button.disabled = false; }
      }); row.append(button);
    }
    list.append(row);
  }
  $('members').replaceChildren(list); showBoard(data); $('status').textContent = '收卷及排行榜已更新。';
}
$('publish').addEventListener('click', async () => {
  if ($('publish').disabled) return; $('publish').disabled = true; const room = draft.room;
  try { const data = await request('/' + room.code + '/publication', { method: 'POST' }); if (draft.room?.code === room.code) showBoard(data); }
  catch (error) { if (draft.room?.code === room.code) { $('status').textContent = error.message; $('publish').disabled = error.code === 'MARKING_PENDING'; } }
});
$('delete-class').addEventListener('click', async () => {
  if ($('delete-class').disabled) return;
  if (!deleteArmed) { deleteArmed = true; $('delete-class').textContent = '確認刪除此班及原筆跡'; return; }
  const room = draft.room; $('delete-class').disabled = true; $('new-class').disabled = true;
  try {
    await request('/' + room.code, { method: 'DELETE' });
    stopReview?.(); stopReview = null; delete draft.room; draft.requestId = crypto.randomUUID();
    $('room').hidden = true; $('review').replaceChildren(); $('members').replaceChildren(); $('board').replaceChildren(); $('create').disabled = false; $('mode').disabled = false; $('status').textContent = '班級及原筆跡已刪除。';
    try { sessionStorage.setItem(storageKey, JSON.stringify(draft)); } catch { $('status').textContent = '班級及原筆跡已刪除；本頁未能保存新設定。'; }
  } catch (error) { $('status').textContent = error.message; }
  finally { $('delete-class').disabled = false; $('new-class').disabled = false; deleteArmed = false; $('delete-class').textContent = '提早刪除此班'; }
});
