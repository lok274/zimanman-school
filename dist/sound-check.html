<!doctype html>
<html lang="zh-Hant-HK">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>語音檢查 · 寫字樂</title>
<style>
  body { max-width:640px; margin:auto; padding:16px; font:18px/1.5 system-ui,sans-serif; color:#20392e; background:#f5f6ed; }
  h1 { font-size:28px; }
  button { min-height:56px; padding:8px 24px; font:inherit; }
  textarea { box-sizing:border-box; display:block; width:100%; margin:16px 0; padding:12px; font:16px/1.5 monospace; }
  button:focus-visible,textarea:focus-visible { outline:3px solid #ba642d; outline-offset:3px; }
</style>
<h1>語音檢查</h1>
<button id="refresh" type="button">重新讀取</button>
<textarea id="voices" aria-label="瀏覽器語音清單" readonly rows="14"></textarea>
<script>
  const result = document.getElementById('voices');
  function refresh() {
    if (!window.speechSynthesis) { result.value = '此瀏覽器不支援語音。'; return; }
    try {
      const voices = window.speechSynthesis.getVoices();
      result.value = ['語音數目：' + voices.length, ...voices.map(voice => voice.lang + ' | ' + voice.name)].join('\n');
    } catch (_) { result.value = '未能讀取瀏覽器語音。'; }
  }
  document.getElementById('refresh').addEventListener('click', refresh);
  window.speechSynthesis?.addEventListener('voiceschanged', refresh);
  refresh();
</script>
</html>
